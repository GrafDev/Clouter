[package]
name = "googletor-core"
version = "0.1.0"
edition = "2021"

[dependencies]
librqbit = "9.0.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
libc = "0.2"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
